name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint · Typecheck · Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependências
        run: yarn install

      - name: Lint (ESLint e Prettier)
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Testes (Vitest)
        run: yarn test

      - name: Build da imagem Docker
        run: docker build -t api-gateway .

  publish:
    name: Publicar imagem (GHCR)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/back-end-cloud-computing/api-gateway:latest
            ghcr.io/back-end-cloud-computing/api-gateway:sha-${{ github.sha }}
