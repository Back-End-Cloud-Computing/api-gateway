image:
  repository: bascratki/api-gateway
  tag: "" # vazio usa o appVersion do Chart.yaml
  pullPolicy: IfNotPresent

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

ingress:
  enabled: true
  className: nginx
  # Vazio = regra sem host, que atende pelo hostname do ELB no EKS.
  host: api.ganjj.local

# Iguais às do k8s/configmap.yaml. As URLs são os Services dos outros repos.
config:
  PORT: "3000"
  METRICS_PORT: "9100"
  LOG_LEVEL: info
  AUTH_BASE_URL: http://authorization:8081
  JWT_ISSUER: ganjj-authorization
  CLIENT_URL: http://client:8082
  ORDER_URL: http://order:8080
  CART_URL: http://shopping-cart:3003
  PRODUCT_URL: http://product-api:8000
  PROMOTION_URL: http://promotion:8000
  UPSTREAM_TIMEOUT_MS: "10000"
  UPSTREAM_TIMEOUT_PRODUCTS_MS: "30000"
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW: 1 minute
  RATE_LIMIT_AUTH_MAX: "10"
  CORS_ORIGINS: ""
