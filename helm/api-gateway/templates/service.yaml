apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: {{ .Values.config.PORT }}
      targetPort: http
    - name: metrics
      port: {{ .Values.config.METRICS_PORT }}
      targetPort: metrics
